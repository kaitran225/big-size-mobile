services:
  - type: web
    name: bigfit-backend
    runtime: docker
    dockerfilePath: ./Server/Backend/Dockerfile
    dockerContext: ./Server/Backend
    healthCheckPath: /api/database/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__Default
        sync: false
      - key: Auth__Jwt__SigningKey
        sync: false
      - key: Auth__Jwt__Issuer
        value: BigFit.Backend
      - key: Auth__Jwt__Audience
        value: BigFit.Mobile
      - key: Payments__SePay__PublicBaseUrl
        value: https://big-fit-pgm-store.onrender.com
      - key: Payments__SePay__ApiBaseUrl
        value: https://bankhub-api-sandbox.sepay.vn
      - key: Payments__SePay__ClientId
        sync: false
      - key: Payments__SePay__ClientSecret
        sync: false
      - key: Payments__SePay__IpnSecretKey
        sync: false
      - key: Payments__SePay__BankAccountXid
        sync: false
